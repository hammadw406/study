<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker>
<marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#263238" stroke-width="1.6"/></marker></defs><rect width="1420" height="760" fill="#fff"/><line x1="860" y1="406" x2="860" y2="650" stroke="#78909C" stroke-width="1.5" stroke-dasharray="6,5"/><line x1="620" y1="126" x2="620" y2="650" stroke="#78909C" stroke-width="1.5" stroke-dasharray="6,5"/><line x1="360" y1="126" x2="360" y2="650" stroke="#78909C" stroke-width="1.5" stroke-dasharray="6,5"/><line x1="120" y1="168" x2="120" y2="650" stroke="#78909C" stroke-width="1.5" stroke-dasharray="6,5"/><text x="710.0" y="36" font-size="24" font-weight="700" fill="#0D2A4A" text-anchor="middle">Sequence Diagram: Notation Guide</text><text x="710.0" y="60" font-size="14" fill="#607D8B" text-anchor="middle">Every element you need for the exam, labelled 1–11 (generic login example)</text><g stroke="#0D2A4A" stroke-width="2" fill="none"><circle cx="120" cy="99" r="9" fill="#fff"/><line x1="120" y1="108" x2="120" y2="128"/><line x1="106" y1="115" x2="134" y2="115"/><line x1="120" y1="128" x2="109" y2="144"/><line x1="120" y1="128" x2="131" y2="144"/></g><text x="120" y="160" font-size="14" font-weight="600" fill="#0D2A4A" text-anchor="middle">User</text><rect x="285.8" y="90" width="148.39999999999998" height="36" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="360" y="114" font-size="15" font-weight="600" fill="#0D2A4A" text-anchor="middle">ui : LoginPage</text><rect x="532.9" y="90" width="174.2" height="36" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="620" y="114" font-size="15" font-weight="600" fill="#0D2A4A" text-anchor="middle">auth : AuthServer</text><rect x="60" y="325" width="900" height="260" fill="#FFFDE7" fill-opacity="0.55" stroke="#F57F17" stroke-width="1.8"/><path d="M60,325 L106,325 L106,341 L98,349 L60,349 Z" fill="#FFE0B2" stroke="#F57F17" stroke-width="1.5"/><text x="68" y="342" font-size="14" font-weight="700" fill="#E65100">alt</text><line x1="60" y1="490" x2="960" y2="490" stroke="#F57F17" stroke-width="1.6" stroke-dasharray="8,6"/><rect x="798.7" y="370" width="122.6" height="36" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="860" y="394" font-size="15" font-weight="600" fill="#0D2A4A" text-anchor="middle">s : Session</text><rect x="114" y="180" width="12" height="450" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5"/><rect x="354" y="190" width="12" height="430" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5"/><rect x="614" y="235" width="12" height="325" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5"/><line x1="126" y1="190" x2="354" y2="190" stroke="#263238" stroke-width="1.8"  marker-end="url(#fill)"/><text x="240.0" y="182" font-size="14" fill="#0D2A4A" text-anchor="middle" >login(id, pwd)</text><line x1="366" y1="235" x2="614" y2="235" stroke="#263238" stroke-width="1.8"  marker-end="url(#fill)"/><text x="490.0" y="227" font-size="14" fill="#0D2A4A" text-anchor="middle" >verify(id, pwd)</text><path d="M626,270 L671,270 L671,300 L628,300" fill="none" stroke="#263238" stroke-width="1.8" marker-end="url(#fill)"/><text x="678" y="290.0" font-size="14" fill="#0D2A4A">checkPassword()</text><rect x="111" y="329" width="67.39999999999999" height="22" rx="4" fill="#FFF8E1" stroke="#FFCC80"/><text x="116" y="345" font-size="14" font-weight="600" fill="#B71C1C">[valid]</text><rect x="65" y="494" width="83.8" height="22" rx="4" fill="#FFF8E1" stroke="#FFCC80"/><text x="70" y="510" font-size="14" font-weight="600" fill="#B71C1C">[invalid]</text><line x1="626" y1="388" x2="798.7" y2="388" stroke="#263238" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#open)"/><text x="712.35" y="380" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="600">«create»</text><line x1="614" y1="455" x2="366" y2="455" stroke="#263238" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#open)"/><text x="490.0" y="447" font-size="14" fill="#6A1B9A" text-anchor="middle" font-style="italic">success</text><line x1="614" y1="545" x2="366" y2="545" stroke="#263238" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#open)"/><text x="490.0" y="537" font-size="14" fill="#6A1B9A" text-anchor="middle" font-style="italic">error (wrong password)</text><line x1="354" y1="612" x2="126" y2="612" stroke="#263238" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#open)"/><text x="240.0" y="604" font-size="14" fill="#6A1B9A" text-anchor="middle" font-style="italic">show result</text><circle cx="80" cy="110" r="11" fill="#E65100"/><text x="80" y="115" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="282" cy="92" r="11" fill="#E65100"/><text x="282" y="97" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="372" cy="640" r="11" fill="#E65100"/><text x="372" y="645" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="382" cy="300" r="11" fill="#E65100"/><text x="382" y="305" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="240" cy="208" r="11" fill="#E65100"/><text x="240" y="213" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="690" cy="258" r="11" fill="#E65100"/><text x="690" y="263" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><circle cx="700" cy="405" r="11" fill="#E65100"/><text x="700" y="410" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text><circle cx="600" cy="472" r="11" fill="#E65100"/><text x="600" y="477" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text><circle cx="45" cy="337" r="11" fill="#E65100"/><text x="45" y="342" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">9</text><circle cx="180" cy="341" r="11" fill="#E65100"/><text x="180" y="346" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">10</text><circle cx="920" cy="490" r="11" fill="#E65100"/><text x="920" y="495" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">11</text><g><rect x="990" y="90" width="410" height="560" rx="12" fill="#F5F7FA" stroke="#CFD8DC"/><text x="1010" y="122" font-size="17" font-weight="700" fill="#0D2A4A">Key</text><circle cx="1022" cy="158" r="11" fill="#E65100"/><text x="1022" y="163" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1042" y="156" font-size="14" font-weight="700" fill="#0D2A4A">Actor</text><text x="1042" y="174" font-size="12.5" fill="#455A64">A person OR another system (stick figure)</text><circle cx="1022" cy="203" r="11" fill="#E65100"/><text x="1022" y="208" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1042" y="201" font-size="14" font-weight="700" fill="#0D2A4A">Object</text><text x="1042" y="219" font-size="12.5" fill="#455A64">Box at top: name : ClassName</text><circle cx="1022" cy="248" r="11" fill="#E65100"/><text x="1022" y="253" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1042" y="246" font-size="14" font-weight="700" fill="#0D2A4A">Lifeline</text><text x="1042" y="264" font-size="12.5" fill="#455A64">Dashed vertical line · time flows DOWN</text><circle cx="1022" cy="293" r="11" fill="#E65100"/><text x="1022" y="298" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1042" y="291" font-size="14" font-weight="700" fill="#0D2A4A">Activation bar</text><text x="1042" y="309" font-size="12.5" fill="#455A64">Thin box · object is busy working</text><circle cx="1022" cy="338" r="11" fill="#E65100"/><text x="1022" y="343" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1042" y="336" font-size="14" font-weight="700" fill="#0D2A4A">Message (call)</text><text x="1042" y="354" font-size="12.5" fill="#455A64">Solid line, filled arrow, operation(params)</text><circle cx="1022" cy="383" r="11" fill="#E65100"/><text x="1022" y="388" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1042" y="381" font-size="14" font-weight="700" fill="#0D2A4A">Self message</text><text x="1042" y="399" font-size="12.5" fill="#455A64">Object calls its OWN operation</text><circle cx="1022" cy="428" r="11" fill="#E65100"/><text x="1022" y="433" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="1042" y="426" font-size="14" font-weight="700" fill="#0D2A4A">Object creation</text><text x="1042" y="444" font-size="12.5" fill="#455A64">«create» · box drawn when it is created</text><circle cx="1022" cy="473" r="11" fill="#E65100"/><text x="1022" y="478" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="1042" y="471" font-size="14" font-weight="700" fill="#0D2A4A">Reply / return</text><text x="1042" y="489" font-size="12.5" fill="#455A64">Dashed line, open arrow</text><circle cx="1022" cy="518" r="11" fill="#E65100"/><text x="1022" y="523" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="1042" y="516" font-size="14" font-weight="700" fill="#0D2A4A">alt fragment</text><text x="1042" y="534" font-size="12.5" fill="#455A64">Box = if / else, only ONE region runs</text><circle cx="1022" cy="563" r="11" fill="#E65100"/><text x="1022" y="568" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">10</text><text x="1042" y="561" font-size="14" font-weight="700" fill="#0D2A4A">Guard</text><text x="1042" y="579" font-size="12.5" fill="#455A64">[condition] that must be true</text><circle cx="1022" cy="608" r="11" fill="#E65100"/><text x="1022" y="613" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">11</text><text x="1042" y="606" font-size="14" font-weight="700" fill="#0D2A4A">Region divider</text><text x="1042" y="624" font-size="12.5" fill="#455A64">Dashed line separating alternatives</text></g><g transform="translate(250.0,710)"><rect x="0" y="-22" width="920" height="44" rx="10" fill="#F5F7FA" stroke="#CFD8DC"/><line x1="20" y1="0" x2="70" y2="0" stroke="#263238" stroke-width="1.8" marker-end="url(#fill)"/><text x="80" y="5" font-size="13" fill="#37474F">Call (solid)</text><line x1="200" y1="0" x2="250" y2="0" stroke="#263238" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#open)"/><text x="260" y="5" font-size="13" fill="#37474F">Reply (dashed)</text><rect x="395" y="-12" width="10" height="24" fill="#BBDEFB" stroke="#1565C0"/><text x="415" y="5" font-size="13" fill="#37474F">Activation bar</text><rect x="545" y="-11" width="26" height="22" fill="#FFE0B2" stroke="#F57F17"/><text x="580" y="5" font-size="13" fill="#37474F">alt = if / else</text><text x="715" y="5" font-size="13" font-weight="600" fill="#B71C1C">[guard]</text><text x="775" y="5" font-size="13" fill="#37474F">= condition</text></g></svg>