<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1120" height="440" fill="#fff"/><text x="560.0" y="36" font-size="24" font-weight="700" fill="#0D2A4A" text-anchor="middle">The Aggregation Association</text><text x="560.0" y="60" font-size="14" fill="#607D8B" text-anchor="middle">&quot;part-of&quot; relationship · Sommerville Ch. 5 · Slide 33</text><rect x="350.0" y="125.0" width="300" height="50" rx="3" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="500" y="156" font-size="16" font-weight="700" fill="#0D2A4A" text-anchor="middle">Patient record</text><polygon points="400,175 410,190 400,205 390,190" fill="#fff" stroke="#263238" stroke-width="2"/><path d="M400,205 L400,325" fill="none" stroke="#263238" stroke-width="2"/><polygon points="600,175 610,190 600,205 590,190" fill="#fff" stroke="#263238" stroke-width="2"/><path d="M600,205 L600,325" fill="none" stroke="#263238" stroke-width="2"/><text x="384" y="200" font-size="15" font-weight="700" fill="#C62828" text-anchor="end" >1</text><text x="384" y="318" font-size="15" font-weight="700" fill="#C62828" text-anchor="end" >1</text><text x="616" y="200" font-size="15" font-weight="700" fill="#C62828" text-anchor="start" >1</text><text x="616" y="318" font-size="15" font-weight="700" fill="#C62828" text-anchor="start" >1..*</text><rect x="315.0" y="325.0" width="170" height="50" rx="3" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="400" y="356" font-size="16" font-weight="700" fill="#0D2A4A" text-anchor="middle">Patient</text><rect x="515.0" y="325.0" width="170" height="50" rx="3" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="600" y="356" font-size="16" font-weight="700" fill="#0D2A4A" text-anchor="middle">Consultation</text><text x="500" y="250" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="middle" font-style="italic">part-of</text><g transform="translate(760,110)"><rect width="330" height="280" rx="12" fill="#F5F7FA" stroke="#CFD8DC"/><text x="18" y="30" font-size="15" font-weight="700" fill="#0D2A4A" text-anchor="start" >How to read it</text><text x="18" y="60" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >A Patient record (the WHOLE)</text><text x="18" y="86" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >is made up of:</text><text x="18" y="112" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >  • exactly 1 Patient (the PART)</text><text x="18" y="138" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >  • 1 or more Consultations (PARTS)</text><text x="18" y="164" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" ></text><text x="18" y="190" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >Hollow diamond ◇ sits at the WHOLE.</text><text x="18" y="216" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >Like the &quot;part-of&quot; relationship</text><text x="18" y="242" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >in semantic data models.</text></g></svg>