-anchor="start" >← inherited from Doctor</text><text x="30" y="160" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start" >Staff #</text><text x="220" y="160" font-size="13.5" font-weight="400" fill="#1B5E20" text-anchor="start" >← own (added)</text><text x="30" y="190" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start" >Pager #</text><text x="220" y="190" font-size="13.5" font-weight="400" fill="#1B5E20" text-anchor="start" >← own (added)</text><text x="30" y="220" font-size="15" font-weight="600" fill="#78909C" text-anchor="start" >register ( )</text><text x="220" y="220" font-size="13.5" font-weight="400" fill="#78909C" text-anchor="start" >← inherited from Doctor</text><text x="30" y="250" font-size="15" font-weight="600" fill="#78909C" text-anchor="start" >de-register ( )</text><text x="220" y="250" font-size="13.5" font-weight="400" fill="#78909C" text-anchor="start" >← inherited from Doctor</text><text x="20" y="300" font-size="13.5" font-weight="400" fill="#37474F" text-anchor="start" >Subclass = superclass features + its own extra features.</text><text x="20" y="325" font-size="13.5" font-weight="400" fill="#37474F" text-anchor="start" font-family="monospace">In Java: class HospitalDoctor extends Doctor</text></g></svg>