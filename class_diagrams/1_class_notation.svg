<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" viewBox="0 0 1220 720" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1220" height="720" fill="#fff"/><text x="610.0" y="36" font-size="24" font-weight="700" fill="#0D2A4A" text-anchor="middle">Class Diagram: Notation Guide</text><text x="610.0" y="60" font-size="14" fill="#607D8B" text-anchor="middle">UML class box (3 parts), association and multiplicity</text><rect x="210" y="110" width="300" height="438" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><line x1="210" y1="156" x2="510" y2="156" stroke="#1565C0" stroke-width="2"/><line x1="210" y1="412" x2="510" y2="412" stroke="#1565C0" stroke-width="2"/><text x="360.0" y="140" font-size="18" font-weight="700" fill="#0D2A4A" text-anchor="middle" >Consultation</text><text x="228" y="184" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Doctors</text><text x="228" y="208" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Date</text><text x="228" y="232" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Time</text><text x="228" y="256" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Clinic</text><text x="228" y="280" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Reason</text><text x="228" y="304" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Medication prescribed</text><text x="228" y="328" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Treatment prescribed</text><text x="228" y="352" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Voice notes</text><text x="228" y="376" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Transcript</text><text x="228" y="400" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >...</text><text x="228" y="440" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >New ( )</text><text x="228" y="464" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Prescribe ( )</text><text x="228" y="488" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >RecordNotes ( )</text><text x="228" y="512" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >Transcribe ( )</text><text x="228" y="536" font-size="15" font-weight="400" fill="#0D2A4A" text-anchor="start" >...</text><path d="M196,114 L186,114 L186,152 L196,152" fill="none" stroke="#E65100" stroke-width="2"/><text x="178" y="131.0" font-size="15" font-weight="700" fill="#E65100" text-anchor="end" >1. Name</text><text x="178" y="149.0" font-size="12.5" font-weight="400" fill="#455A64" text-anchor="end" >class name</text><path d="M196,160 L186,160 L186,408 L196,408" fill="none" stroke="#E65100" stroke-width="2"/><text x="178" y="282.0" font-size="15" font-weight="700" fill="#E65100" text-anchor="end" >2. Attributes</text><text x="178" y="300.0" font-size="12.5" font-weight="400" fill="#455A64" text-anchor="end" >the data each</text><text x="178" y="316.0" font-size="12.5" font-weight="400" fill="#455A64" text-anchor="end" >object holds</text><path d="M196,416 L186,416 L186,544 L196,544" fill="none" stroke="#E65100" stroke-width="2"/><text x="178" y="478.0" font-size="15" font-weight="700" fill="#E65100" text-anchor="end" >3. Operations</text><text x="178" y="496.0" font-size="12.5" font-weight="400" fill="#455A64" text-anchor="end" >what objects can do</text><text x="360.0" y="576" font-size="13" font-weight="400" fill="#607D8B" text-anchor="middle" >Slide 25: The Consultation class</text><text x="600" y="130" font-size="17" font-weight="700" fill="#0D2A4A" text-anchor="start" >Association + multiplicity (slide 23)</text><rect x="615.0" y="175.0" width="150" height="50" rx="3" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="690" y="206" font-size="16" font-weight="700" fill="#0D2A4A" text-anchor="middle">Patient</text><rect x="935.0" y="175.0" width="190" height="50" rx="3" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="1030" y="206" font-size="16" font-weight="700" fill="#0D2A4A" text-anchor="middle">Patient record</text><path d="M765,200 L935,200" fill="none" stroke="#263238" stroke-width="2"/><text x="775" y="190" font-size="15" font-weight="700" fill="#C62828" text-anchor="start" >1</text><text x="923" y="190" font-size="15" font-weight="700" fill="#C62828" text-anchor="end" >1</text><path d="M850,215 L850,250" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,3"/><text x="850" y="268" font-size="13" font-weight="600" fill="#E65100" text-anchor="middle" >association = a link between classes</text><path d="M775,176 L750,150" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,3"/><text x="720" y="145" font-size="13" font-weight="600" fill="#E65100" text-anchor="middle" >multiplicity</text><text x="600" y="305" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >Read it:  &quot;Each patient has exactly ONE patient record,</text><text x="600" y="325" font-size="14" font-weight="400" fill="#37474F" text-anchor="start" >and each patient record belongs to exactly ONE patient.&quot;</text><text x="600" y="380" font-size="17" font-weight="700" fill="#0D2A4A" text-anchor="start" >Multiplicity values</text><rect x="600" y="394" width="560" height="210" rx="10" fill="#F5F7FA" stroke="#CFD8DC"/><text x="630" y="426" font-size="15" font-weight="700" fill="#C62828" text-anchor="start" >1</text><text x="770" y="426" font-size="15" font-weight="400" fill="#37474F" text-anchor="start" >exactly one</text><text x="630" y="466" font-size="15" font-weight="700" fill="#C62828" text-anchor="start" >0..1</text><text x="770" y="466" font-size="15" font-weight="400" fill="#37474F" text-anchor="start" >zero or one (optional)</text><text x="630" y="506" font-size="15" font-weight="700" fill="#C62828" text-anchor="start" >*  or  0..*</text><text x="770" y="506" font-size="15" font-weight="400" fill="#37474F" text-anchor="start" >zero or more (many)</text><text x="630" y="546" font-size="15" font-weight="700" fill="#C62828" text-anchor="start" >1..*</text><text x="770" y="546" font-size="15" font-weight="400" fill="#37474F" text-anchor="start" >one or more</text><text x="630" y="586" font-size="15" font-weight="700" fill="#C62828" text-anchor="start" >1..4</text><text x="770" y="586" font-size="15" font-weight="400" fill="#37474F" text-anchor="start" >between 1 and 4 (a range)</text><text x="600" y="650" font-size="13.5" font-weight="400" fill="#455A64" text-anchor="start" >Tip: multiplicity is written at the FAR end of the line,</text><text x="600" y="670" font-size="13.5" font-weight="400" fill="#455A64" text-anchor="start" >next to the class it counts.</text></svg>